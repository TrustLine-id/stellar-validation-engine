[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["Trustline Digital Asset Ltd. <contact@trustline.id>"]
repository = "https://github.com/TrustLine-id/stellar-validation-engine"

[workspace.dependencies]
soroban-sdk = "27"
trustline-sdk = "0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
