# Builds and tests from a clean checkout, with no sibling repositories and no local
# cargo configuration. This mirrors exactly what a reviewer gets when they clone the
# repository and follow the README, which is the only environment that matters.
#
# Do not add a checkout of a sibling repository or generate .cargo/config.toml here.
# Doing so would hide the very class of failure this job exists to catch.

name: build-and-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  clean-clone:
    name: Clean clone build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Load pinned tool versions
        run: |
          set -a
          # shellcheck disable=SC1091
          source versions.env
          set +a
          echo "RUST_VERSION=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "STELLAR_CLI_VERSION=$STELLAR_CLI_VERSION" >> "$GITHUB_ENV"

      - name: Install pinned Rust with the Soroban wasm target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32v1-none

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install pinned Stellar CLI
        run: |
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version
          rustc --version

      - name: Confirm no local cargo override is present
        run: |
          if [ -f .cargo/config.toml ]; then
            echo "::error::.cargo/config.toml is committed. It redirects trustline-sdk to a"
            echo "::error::local path."
            exit 1
          fi

      - name: Confirm Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build contracts
        run: stellar contract build

      - name: Check WASM hashes match the committed baselines
        run: ./scripts/check-wasm-hashes.sh

      - name: Run tests
        run: cargo test --workspace
